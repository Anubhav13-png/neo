# Golden questions: run `neo eval golden/core.yaml` (scripted: replays each model) or `--live` (asks the LLM).
# `ontology publish --eval golden/core.yaml` makes a new ontology version current only if every case passes.
# Answers are pinned only for the deals data (a fixed CSV); other cases check the status and the self-check.
# A case without `user` runs as the first user in config/users.yaml.
cases:
  - id: failed_deals_1980s
    question: How many failed-bank deals happened in the 1980s?
    model:
      form: value
      interpretation: Count of deals that were assisted or failed-bank deals with year 1980 to 1989.
      universe: {entity: deal}
      rows: "is_assisted_failed and 1980 <= year <= 1989"
      target: {expr: "count()"}
      grounding:
        terms: [term_assisted_failed_deal, term_deal_year]
        constraints_applied: [{id: con_failure_detail_coverage, how: "counted with deal_category, not failure_* columns"}]
    expect: {status: proved, answer: 132, self_check: true}

  - id: largest_deals
    question: Which three banks were largest before the deal, in billions?
    model:
      form: extremum
      interpretation: The three deals with the largest target pre-deal assets, in $ billions.
      universe: {entity: deal}
      target: {expr: "target_assets_pre_deal_000 / 1e6", sense: max, top: 3}
      grounding:
        constraints_applied:
          - {id: con_unit_thousands, how: "thousands of dollars divided by 1e6 gives billions"}
          - {id: con_predeal_coverage, how: "rows without a pre-deal figure are excluded and counted"}
    expect: {status: proved, answer: [{value: 307.021614}, {value: 259.527}, {value: 232.944161}], self_check: true}

  - id: failed_share_by_decade
    question: What share of deals were failed-bank deals in each decade?
    model:
      form: table
      interpretation: Per decade of the deal year, the number of deals and the share that were failed-bank deals.
      universe: {entity: deal}
      group_by: "year // 10 * 10"
      target: {columns: {deals: "count()", failed_share: "share(is_assisted_failed)"}}
      grounding:
        constraints_applied: [{id: con_failure_detail_coverage, how: "deal_category flag"}]
    expect: {status: proved, self_check: true}

  - id: card_exposure_emea
    question: What is our total exposure on cards?
    user: ana          # a row-policy case: skipped where user `ana` is not configured (tests/users.yaml defines it)
    model:
      form: value
      interpretation: Total outstanding balance of card loans visible to the user, in USD.
      universe: {entity: loan}
      rows: "product == 'Card'"
      target: {columns: {exposure_usd: "sum(balance_usd)", loans: "count()"}}
    expect: {status: proved, self_check: true}

  - id: exposure_by_segment
    question: What is our exposure by customer segment?
    model:
      form: table
      interpretation: Total outstanding balance per customer segment, in USD.
      universe: {entity: loan, joins: [{relation: rel_loan_customer, as: cust}]}
      group_by: cust.segment
      target: {columns: {exposure_usd: "sum(balance_usd)"}}
    expect: {status: proved, self_check: true}

  - id: rate_cut_break_even
    question: What is the largest rate cut that keeps every loan's rate above its expected loss rate?
    model:
      form: optimisation
      interpretation: The largest uniform cut to every loan's annual rate such that rate minus cut stays at or above PD x LGD for every loan.
      universe: {entity: loan}
      variables: [{name: cut, sort: Real, domain: "cut >= -1", unit: ratio}]
      constraints: [{name: every_loan, expr: "all_rows(rate - cut >= pd * lgd)"}]
      target: {objective: cut, sense: max}
      grounding:
        constraints_applied: [{id: con_expected_loss_meaning, how: "PD x LGD used as a 12-month expected loss rate"}]
    expect: {status: optimal}
