[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo"
version = "0.1.0"
description = "Ontology-grounded, proof-carrying question answering over a data lake"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.1",
  "z3-solver>=4.12",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
lake = ["sqlalchemy>=2.0"]          # plus your engine's dialect: trino, snowflake-sqlalchemy, databricks-sql-connector
dev = ["pytest>=8"]

[project.scripts]
neo = "neo.cli:main"

[tool.setuptools.packages.find]
include = ["neo*"]

[tool.setuptools.package-data]
neo = ["prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
